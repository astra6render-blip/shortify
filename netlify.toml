# Optional: serve the static site on Netlify's CDN while renders run on your
# own server / container. Set SHORTIFY_API to your render host.
[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://render.yourdomain.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/renders/*"
  to = "https://render.yourdomain.com/renders/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
